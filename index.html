<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#160b20">
  <title>فخارة | القائمة الرقمية</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap');

    :root {
      --bg: #100817;
      --bg2: #1b0e25;
      --panel: rgba(39, 20, 49, .72);
      --panel2: rgba(57, 27, 53, .55);
      --gold: #ffc52a;
      --orange: #ff9418;
      --cream: #fff5df;
      --muted: #c8b8c9;
      --red: #ef4d35;
      --line: rgba(255, 197, 42, .18);
      --shadow: 0 24px 70px rgba(0, 0, 0, .35);
      --r: 28px
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    body {
      margin: 0;
      font-family: Cairo, system-ui, sans-serif;
      color: var(--cream);
      background: radial-gradient(circle at 82% 8%, rgba(255, 148, 24, .14), transparent 26%), radial-gradient(circle at 10% 55%, rgba(120, 30, 91, .18), transparent 30%), linear-gradient(135deg, var(--bg), #1a0b22 52%, #0e0713);
      min-height: 100vh
    }

    body:before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .035;
      background-image: radial-gradient(#fff 1px, transparent 1px);
      background-size: 4px 4px
    }

    .wrap {
      width: min(1180px, calc(100% - 32px));
      margin: auto
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 0 10px
    }

    .brand-mini {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 800
    }

    .brand-mini img {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      box-shadow: 0 0 30px rgba(255, 174, 25, .18)
    }

    .status {
      border: 1px solid rgba(255, 197, 42, .25);
      background: rgba(43, 22, 49, .68);
      padding: 8px 14px;
      border-radius: 999px;
      color: #ffe8ad;
      font-size: 13px
    }

    .status:before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #39d56f;
      margin-left: 7px;
      box-shadow: 0 0 12px #39d56f
    }

    .hero {
      position: relative;
      overflow: hidden;
      margin: 12px 0 28px;
      padding: 42px 34px 34px;
      border: 1px solid var(--line);
      border-radius: 36px;
      background: linear-gradient(145deg, rgba(53, 27, 63, .84), rgba(28, 14, 36, .68));
      box-shadow: var(--shadow)
    }

    .hero:after {
      content: "";
      position: absolute;
      width: 440px;
      height: 440px;
      left: -120px;
      top: -180px;
      background: radial-gradient(circle, rgba(255, 148, 24, .22), transparent 68%);
      filter: blur(12px)
    }

    .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 230px 1fr;
      gap: 38px;
      align-items: center
    }

    .hero-logo {
      width: 210px;
      height: 210px;
      object-fit: contain;
      border-radius: 50%;
      filter: drop-shadow(0 16px 28px rgba(0, 0, 0, .4)) drop-shadow(0 0 28px rgba(255, 169, 24, .12))
    }

    .eyebrow {
      display: inline-flex;
      padding: 7px 13px;
      border: 1px solid rgba(255, 197, 42, .22);
      border-radius: 999px;
      background: rgba(54, 28, 48, .7);
      color: #ffe5a1;
      font-size: 13px;
      font-weight: 700
    }

    .hero h1 {
      font-size: clamp(40px, 7vw, 76px);
      line-height: 1;
      margin: 16px 0 8px;
      color: var(--gold);
      font-weight: 900;
      letter-spacing: -2px
    }

    .hero h2 {
      margin: 0;
      color: #fff7eb;
      font-size: 21px;
      font-weight: 600
    }

    .hero p {
      color: var(--muted);
      margin: 12px 0 0;
      font-size: 15px
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 22px
    }

    .btn {
      border: 0;
      border-radius: 16px;
      padding: 13px 20px;
      font: 700 15px Cairo;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: .25s
    }

    .btn-main {
      background: linear-gradient(135deg, #ffd34b, #ff9418);
      color: #26120a;
      box-shadow: 0 10px 30px rgba(255, 148, 24, .18)
    }

    .btn-ghost {
      background: rgba(255, 255, 255, .06);
      color: #fff1d1;
      border: 1px solid rgba(255, 197, 42, .2)
    }

    .btn:hover {
      transform: translateY(-2px)
    }

    .nav {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 10px 0 16px;
      background: linear-gradient(var(--bg) 58%, transparent);
      backdrop-filter: blur(9px)
    }

    .nav-scroll {
      display: flex;
      gap: 9px;
      overflow: auto;
      padding: 3px 2px 6px;
      scrollbar-width: none
    }

    .nav-scroll::-webkit-scrollbar {
      display: none
    }

    .chip {
      white-space: nowrap;
      border: 1px solid rgba(255, 197, 42, .16);
      background: rgba(37, 18, 45, .78);
      color: #dfd0dd;
      border-radius: 999px;
      padding: 10px 15px;
      font: 700 13px Cairo;
      cursor: pointer;
      transition: .2s
    }

    .chip.active,
    .chip:hover {
      background: linear-gradient(135deg, #ffcb32, #ff8e16);
      color: #24100b;
      border-color: transparent
    }

    .section {
      margin: 42px 0
    }

    .section-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 18px
    }

    .section-head h2 {
      margin: 0;
      font-size: 30px;
      color: #fff4df
    }

    .section-head h2 span {
      display: block;
      color: var(--gold);
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 2px
    }

    .section-head p {
      margin: 0;
      color: #aa98ad;
      font-size: 13px
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px
    }

    .card {
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .08);
      background: linear-gradient(145deg, rgba(54, 28, 57, .78), rgba(27, 14, 36, .72));
      border-radius: var(--r);
      padding: 20px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .18);
      transition: .25s
    }

    .card:hover {
      transform: translateY(-4px);
      border-color: rgba(255, 197, 42, .24);
      box-shadow: 0 20px 55px rgba(0, 0, 0, .3)
    }

    .card.featured {
      min-height: 230px
    }

    .card.featured:before {
      content: "";
      position: absolute;
      inset: auto auto -100px -80px;
      width: 240px;
      height: 240px;
      background: radial-gradient(circle, rgba(255, 148, 24, .2), transparent 68%)
    }

    .photo {
      width: 100%;
      height: 145px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 15px;
      filter: saturate(1.08) contrast(1.02)
    }

    .tag {
      font-size: 11px;
      color: #ffd77a;
      font-weight: 800;
      margin-bottom: 7px
    }

    .name {
      font-size: 19px;
      font-weight: 800;
      color: #fff8eb;
      margin: 0 0 5px
    }

    .desc {
      font-size: 12px;
      line-height: 1.8;
      color: #bba9bc;
      margin: 0 0 14px
    }

    .price-row {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 10px
    }

    .prices {
      display: flex;
      flex-wrap: wrap;
      gap: 7px
    }

    .price {
      padding: 6px 10px;
      border-radius: 12px;
      background: rgba(255, 148, 24, .09);
      border: 1px solid rgba(255, 197, 42, .13);
      color: #ffd75c;
      font-size: 13px;
      font-weight: 800
    }

    .price small {
      color: #b8a7b6;
      font-weight: 600;
      font-size: 10px;
      margin-left: 4px
    }

    .single-price {
      font-size: 24px;
      font-weight: 900;
      color: var(--gold)
    }

    .single-price small {
      font-size: 10px;
      color: #b9a8b8;
      font-weight: 600
    }

    .offer-grid {
      display: grid;
      grid-template-columns: 1.3fr .85fr;
      gap: 15px
    }

    .offer {
      padding: 24px;
      min-height: 220px
    }

    .offer.big {
      background: linear-gradient(135deg, rgba(80, 35, 55, .9), rgba(32, 16, 40, .78));
      border-color: rgba(255, 148, 24, .2)
    }

    .offer h3 {
      font-size: 24px;
      margin: 0 0 7px
    }

    .offer .desc {
      max-width: 650px
    }

    .offer-price {
      font-size: 32px;
      font-weight: 900;
      color: var(--gold)
    }

    .contact {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px
    }

    .contact .card {
      padding: 24px
    }

    .phone {
      font-size: 20px;
      font-weight: 800;
      color: #fff2d5;
      margin: 9px 0
    }

    .address {
      line-height: 2;
      color: #d2c1d1
    }

    .footer {
      margin-top: 60px;
      padding: 35px 0 55px;
      border-top: 1px solid rgba(255, 255, 255, .08);
      text-align: center
    }

    .footer img {
      width: 88px
    }

    .footer h3 {
      margin: 10px 0 0;
      color: var(--gold)
    }

    .footer p {
      color: #a995aa;
      margin: 3px 0
    }

    .float-wa {
      position: fixed;
      left: 20px;
      bottom: 20px;
      z-index: 30;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #ffd34b, #ff9418);
      color: #26120a;
      text-decoration: none;
      font-weight: 900;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .4);
      border: 3px solid rgba(255, 255, 255, .25);
      transition: .2s ease
    }

    .wa-icon {
      font-size: 25px
    }

    .empty {
      display: none;
      text-align: center;
      padding: 30px;
      color: #bba9bc
    }

    .hidden {
      display: none !important
    }

    @media(max-width:850px) {
      .hero-grid {
        grid-template-columns: 1fr;
        text-align: center
      }

      .hero-logo {
        width: 170px;
        height: 170px;
        margin: auto
      }

      .actions {
        justify-content: center
      }

      .grid {
        grid-template-columns: repeat(2, 1fr)
      }

      .offer-grid,
      .contact {
        grid-template-columns: 1fr
      }
    }

    @media(max-width:560px) {
      .wrap {
        width: min(100% - 20px, 1180px)
      }

      .topbar {
        padding-top: 14px
      }

      .brand-mini img {
        width: 42px;
        height: 42px
      }

      .hero {
        padding: 28px 18px;
        border-radius: 28px
      }

      .hero h1 {
        font-size: 46px
      }

      .hero h2 {
        font-size: 18px
      }

      .grid {
        grid-template-columns: 1fr
      }

      .card {
        padding: 18px
      }

      .section {
        margin: 34px 0
      }

      .section-head {
        align-items: start;
        flex-direction: column;
        gap: 4px
      }

      .nav {
        top: 0
      }

      .chip {
        padding: 9px 13px
      }

      .float-wa {
        left: 14px;
        bottom: 14px
      }
    }

    .phone-icon {
      width: 25px;
      height: 25px;
      display: block;
      fill: currentColor
    }

    @media(max-width:560px) {
      body {
        overflow-x: hidden
      }

      .wrap {
        width: calc(100% - 20px);
        max-width: none
      }

      .topbar {
        gap: 8px
      }

      .brand-mini {
        min-width: 0
      }

      .brand-mini span {
        white-space: nowrap
      }

      .status {
        white-space: nowrap;
        flex: 0 0 auto
      }

      .hero-grid {
        gap: 22px
      }

      .hero-logo {
        width: min(170px, 48vw);
        height: auto;
        aspect-ratio: 1
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr;
        width: 100%
      }

      .btn {
        width: 100%;
        min-height: 52px
      }

      .nav {
        margin-left: -10px;
        margin-right: -10px;
        padding-left: 10px;
        padding-right: 10px
      }

      .nav-scroll {
        scroll-snap-type: x proximity
      }

      .chip {
        scroll-snap-align: start;
        flex: 0 0 auto
      }

      .section {
        scroll-margin-top: 82px
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 9px
      }

      .card {
        min-width: 0;
        padding: 12px;
        border-radius: 18px
      }

      .card.featured {
        min-height: 0
      }

      .photo {
        height: 92px;
        min-height: 0;
        margin-bottom: 8px;
        border-radius: 13px
      }

      .name {
        font-size: 14px;
        line-height: 1.45;
        margin-bottom: 2px
      }

      .desc {
        font-size: 9.5px;
        line-height: 1.5;
        margin-bottom: 7px
      }

      .price-row {
        align-items: center
      }

      .prices {
        gap: 4px
      }

      .price {
        font-size: 10px;
        padding: 4px 5px;
        border-radius: 8px
      }

      .price small {
        font-size: 7px;
        margin-left: 2px
      }

      .single-price,
      .offer-price {
        font-size: 18px
      }

      .offer-grid,
      .contact {
        grid-template-columns: 1fr;
        gap: 10px
      }

      .offer {
        min-height: 0
      }

      .section-head {
        margin-bottom: 14px
      }

      .section-head h2 {
        font-size: 25px;
        line-height: 1.35
      }

      .footer {
        margin-top: 42px;
        padding-bottom: calc(40px + env(safe-area-inset-bottom))
      }

      .float-wa {
        left: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        width: 56px;
        height: 56px
      }
    }

    @media(max-width:360px) {
      .wrap {
        width: calc(100% - 16px)
      }

      .brand-mini img {
        width: 38px;
        height: 38px
      }

      .brand-mini {
        font-size: 13px
      }

      .status {
        font-size: 11px;
        padding: 7px 10px
      }

      .hero {
        padding: 24px 14px
      }

      .hero h1 {
        font-size: 40px
      }

      .hero h2 {
        font-size: 17px
      }
    }

    /* Compact mobile menu: more dishes visible without sacrificing readability */
    @media(max-width:560px) {
      .section {
        margin: 24px 0
      }

      .section-head {
        margin-bottom: 10px
      }

      .section-head h2 {
        font-size: 22px
      }

      .section-head h2 span {
        font-size: 10px
      }

      .section-head p {
        font-size: 11px
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px
      }

      .card {
        padding: 11px;
        border-radius: 18px
      }

      .card.featured {
        min-height: 0
      }

      .photo {
        height: 88px;
        min-height: 0;
        margin-bottom: 7px;
        border-radius: 12px
      }

      .tag {
        font-size: 8px;
        margin-bottom: 2px
      }

      .name {
        font-size: 14px;
        line-height: 1.4;
        margin-bottom: 2px
      }

      .desc {
        font-size: 9px;
        line-height: 1.45;
        margin-bottom: 6px
      }

      .price-row {
        gap: 4px
      }

      .prices {
        gap: 3px
      }

      .price {
        font-size: 9.5px;
        padding: 4px 5px;
        border-radius: 8px
      }

      .price small {
        font-size: 7px
      }

      .single-price,
      .offer-price {
        font-size: 18px
      }

      .offer {
        padding: 15px;
        min-height: 0
      }

      .offer h3 {
        font-size: 19px;
        margin-bottom: 4px
      }

      .contact .card {
        padding: 16px
      }

      .phone {
        font-size: 17px;
        margin: 6px 0
      }

      .footer {
        margin-top: 30px
      }

      .float-wa {
        left: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        width: 54px;
        height: 54px
      }

      .phone-icon {
        width: 25px;
        height: 25px;
        fill: currentColor
      }
    }

    @media(max-width:360px) {
      .section {
        margin: 20px 0
      }

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px
      }

      .card {
        padding: 9px;
        border-radius: 15px
      }

      .photo {
        height: 78px
      }

      .name {
        font-size: 13px
      }

      .desc {
        font-size: 8.5px
      }

      .price {
        font-size: 9px;
        padding: 3px 4px
      }
    }


    @media(max-width:560px) {

      /* Two-column mobile menu: compact cards for fast browsing */
      .grid .card {
        display: flex;
        flex-direction: column
      }

      .grid .card .price-row {
        margin-top: auto
      }

      .grid .card.featured:before {
        width: 130px;
        height: 130px;
        inset: auto auto -60px -45px
      }
    }


    /* Hero action icons */
    .btn-icon {
      width: 21px;
      height: 21px;
      fill: currentColor;
      flex: 0 0 auto
    }

    .whatsapp-btn {
      gap: 9px
    }

    .whatsapp-icon {
      width: 22px;
      height: 22px
    }

    .back-icon {
      transform: rotate(180deg)
    }


    .float-whatsapp {
      position: fixed;
      left: 20px;
      bottom: 88px;
      z-index: 30;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #20c96b;
      color: #fff;
      text-decoration: none;
      box-shadow: 0 12px 35px rgba(0, 0, 0, .4);
      border: 3px solid rgba(255, 255, 255, .25);
      transition: .2s ease
    }

    .float-whatsapp:hover {
      transform: translateY(-2px) scale(1.04)
    }

    .float-icon {
      width: 26px;
      height: 26px;
      fill: currentColor
    }

    @media(max-width:560px) {
      .float-whatsapp {
        left: 12px;
        bottom: max(76px, calc(68px + env(safe-area-inset-bottom)));
        width: 54px;
        height: 54px
      }

      .float-icon {
        width: 24px;
        height: 24px
      }
    }
  </style>
  <link rel="stylesheet" href="assets/app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand-mini">
        <a href="/" aria-label="العودة للرئيسية"><img src="assets/logo.png" alt="شعار فخارة"></a>
        <span data-i18n="brand">فخارة</span>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <div id="table-badge" class="eyebrow" style="display:none; margin:0;"><span id="table-number"></span></div>
        <div class="status" data-i18n="status_ready">جاهزين لطلبك</div>
        <button class="chip" style="padding:6px 10px; margin:0; min-width:44px; text-align:center"
          onclick="app.toggleLang()" id="lang-btn">EN</button>
      </div>
    </header>
    <section class="hero">
      <div class="hero-grid"><img class="hero-logo" src="assets/logo.png" alt="Fokhara logo">
        <div><span class="eyebrow">طعم شرقي • جودة بلدي</span>
          <h1>منيو فخارة</h1>
          <div class="actions" id="table-actions" style="display:none; gap:10px; margin-top:20px;">
            <button id="req-waiter" class="btn btn-main" onclick="app.requestService('waiter')">طلب الجرسون</button>
            <button id="req-bill" class="btn btn-ghost" onclick="app.requestService('bill')">طلب الحساب</button>


          </div>
        </div>
      </div>
    </section>
    <div class="search-container">
      <input type="text" id="search-input" data-i18n-placeholder="search" placeholder="بحث في المنيو..."
        oninput="app.search(this.value)">
    </div>
    <div class="filters-scroll" id="filters">
      <button class="chip active" data-filter="all" onclick="app.setFilter('all')" data-i18n="filter_all">الكل</button>
      <button class="chip" data-filter="popular" onclick="app.setFilter('popular')" data-i18n="filter_popular">الأكثر
        طلبًا</button>
      <button class="chip" data-filter="spicy" onclick="app.setFilter('spicy')" data-i18n="filter_spicy">حار</button>
      <button class="chip" data-filter="veg" onclick="app.setFilter('veg')" data-i18n="filter_veg">نباتي</button>
      <button class="chip" data-filter="new" onclick="app.setFilter('new')" data-i18n="filter_new">جديد</button>
    </div>
    <nav class="nav">
      <div class="nav-scroll" id="nav"></div>
    </nav>
    <main id="menu"></main>
    <div id="offers-container"></div>
